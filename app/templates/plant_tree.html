<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant a Tree</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Plant a Tree 🌱</h1>

        <p>
            Welcome, <strong>{{ user_name }}</strong>
        </p>

        <form action="/plant-tree" method="post">

            <!-- Tree Name -->
            <div class="box">
                <label for="tree_name">
                    <strong>Tree Name</strong>
                </label>

                <br><br>

                <input
                    type="text"
                    id="tree_name"
                    name="tree_name"
                    placeholder="Enter tree name"
                    required
                >
            </div>


            <br>


            <!-- Location -->
            <div class="box">

                <label for="location_id">
                    <strong>Select Location</strong>
                </label>

                <br><br>

                <select
                    id="location_id"
                    name="location_id"
                    required
                >

                    <option value="">
                        Select Location
                    </option>

                    {% for location in locations %}

                        <option value="{{ location.id }}">
                            {{ location.location_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <br>


            <!-- Planting Date -->
            <div class="box">

                <label for="planting_date">
                    <strong>Planting Date</strong>
                </label>

                <br><br>

                <input
                    type="date"
                    id="planting_date"
                    name="planting_date"
                    required
                >

            </div>


            <br>


            <!-- Submit -->
            <button type="submit">
                🌱 Plant Tree
            </button>

        </form>


        <br>

        <a href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
