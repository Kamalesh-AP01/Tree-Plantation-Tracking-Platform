<!DOCTYPE html>
<html>
<head>
    <title>Plant a Tree</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Plant a Tree</h1>

        <p>Welcome, <strong>{{ user_name }}</strong></p>

        <form action="/plant-tree" method="post">

            <label for="tree_name">Tree Name</label>
            <input
                type="text"
                id="tree_name"
                name="tree_name"
                placeholder="Enter tree name"
                required
            >

            <br><br>

            <label for="location_id">Location</label>

            <select
                id="location_id"
                name="location_id"
                required
            >
                <option value="">Select Location</option>

                {% for location in locations %}
                    <option value="{{ location.id }}">
                        {{ location.location_name }}
                    </option>
                {% endfor %}

            </select>

            <br><br>

            <label for="planting_date">Planting Date</label>

            <input
                type="date"
                id="planting_date"
                name="planting_date"
                required
            >

            <br><br>

            <button type="submit">
                Plant Tree
            </button>

        </form>

    </div>

</body>
</html>
